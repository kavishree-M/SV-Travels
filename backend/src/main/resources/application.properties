# SV Travels email-only booking application
spring.application.name=sv-travels-backend
server.port=${PORT:8080}

# Booking notifications use Gmail SMTP with an App Password supplied through
# the backend environment. No booking data is stored in a database.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

svtravels.email.official=${SV_TRAVELS_EMAIL:${MAIL_USERNAME:}}
# CORS Configuration
svtravels.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173,https://*.onrender.com,https://*.run.app}

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
